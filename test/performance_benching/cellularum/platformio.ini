; On-device cycle-counter microbenchmark for the string entries, against the target's own libc.
; Two envs, because the library is built for both instruction sets: `pio run -e esp32s3 -t upload -t
; monitor` for Xtensa, `-e esp32c6` for RISC-V. See performance_benching/common.ini.
[platformio]
src_dir = main
extra_configs = ../common.ini

[env:esp32s3]
extends = common_s3
build_flags =
    ${common_s3.build_flags}
    -I../common

[env:esp32c6]
extends = common_c6
build_flags =
    ${common_c6.build_flags}
    -I../common
