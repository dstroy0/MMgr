; On-device cycle-counter microbenchmark for the string entries, against the target's own libc.
; Two envs, because the library is built for both instruction sets: `pio run -e esp32s3 -t upload -t
; monitor` for Xtensa, `-e esp32c6` for RISC-V. See performance_benching/common.ini.
[platformio]
src_dir = main
extra_configs = ../common.ini

[env:esp32s3]
extends = common_s3
build_flags =
    ${common_s3.build_flags}
    -I../common

[env:esp32c6]
extends = common_c6
build_flags =
    ${common_c6.build_flags}
    -I../common

; The Teensy has no ESP-IDF component system to compile the library for it, so the sources are named
; here instead: build_src_filter reaches back up to src/ and takes the tree. One cost table, as
; main/CMakeLists.txt does for the IDF path - the five ancorae files define the same symbol, so the
; four that are not selected come back out.
[env:teensy41]
extends = common_t41
build_flags =
    ${common_t41.build_flags}
    -I../common
    -I../../../src
build_src_filter =
    +<*>
    +<../../../../src/>
    -<../../../../src/impensa_ancorae_acus/impensa_ancorae_acus_english.c>
    -<../../../../src/impensa_ancorae_acus/impensa_ancorae_acus_inet.c>
    -<../../../../src/impensa_ancorae_acus/impensa_ancorae_acus_route.c>
    -<../../../../src/impensa_ancorae_acus/impensa_ancorae_acus_uri.c>
