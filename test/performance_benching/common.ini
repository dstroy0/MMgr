; Shared PlatformIO settings for every on-device cycle-counter microbenchmark under
; performance_benching/. The benches are C11 on ESP-IDF: each module's dir holds main/main.c and its
; main/CMakeLists.txt. Each module's own platformio.ini pulls this in with
; `extra_configs = ../common.ini`, extends one of the target blocks below, and adds `-I../common`.
;
; PlatformIO is the second way to build these; idf.py is the first, and the one the READMEs give.
; PlatformIO does not carry the -flto that these benches need - see README.md - so a run through it
; measures the library built in a shape it never ships in.
;
; Two targets, because the library is built for both instruction sets and they answer differently.
; The S3 is Xtensa LX7 at 240 MHz; the C6 is RISC-V at 160 MHz. A cycle count is comparable between
; them, a wall time is not, so the benches report cycles first.

[common_s3]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = espidf

[common_c6]
platform = espressif32@6.13.0
board = esp32-c6-devkitc-1
framework = espidf
