; Shared PlatformIO settings for every on-device cycle-counter microbenchmark under
; performance_benching/. The benches are C11 on ESP-IDF: each module's dir holds main/main.c and its
; main/CMakeLists.txt. Each module's own platformio.ini pulls this in with
; `extra_configs = ../common.ini`, extends one of the target blocks below, and adds `-I../common`.
;
; PlatformIO is the second way to build these; idf.py is the first, and the one the READMEs give.
; PlatformIO does not carry the -flto that these benches need - see README.md - so a run through it
; measures the library built in a shape it never ships in.
;
; Three targets, because the library is built for each and they answer differently. The S3 is Xtensa
; LX7 at 240 MHz; the C6 is RISC-V at 160 MHz; the Teensy 4.1 is a Cortex-M7 i.MX RT1062 at 600 MHz.
; A cycle count is comparable between them, a wall time is not, so the benches report cycles first.
;
; The Teensy is the only one of the three whose hardware takes an unaligned word load in one
; instruction, so MMGR_HW_FAST_UNALIGNED is 1 there and 0 on both ESP parts. It carries the same
; 32-bit mmgr_word the C6 does, which is what makes that pair a comparison of the one property
; rather than of two at once.

; build_flags is declared empty rather than left out. Every module's env interpolates
; ${common_<target>.build_flags} and appends its own -I, and PlatformIO rejects the whole file when
; an interpolated key is absent - so leaving it out failed to parse for every env in the file, not
; only for the one being built. The ESP targets take their flags from sdkconfig and main/CMakeLists
; instead, which is why there was nothing to put here.
[common_s3]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = espidf
build_flags =

[common_c6]
platform = espressif32@6.13.0
board = esp32-c6-devkitc-1
framework = espidf
build_flags =

; Arduino rather than ESP-IDF, so there is no sdkconfig and no main/CMakeLists.txt to read a rate
; out of - the clock is named here instead, and the probe that read 600000000 Hz off the part is what
; says it is right. There is no idf.py path for this target, so unlike the ESP envs this one carries
; the -flto the benches need itself; without it a run measures the library in a shape it never ships
; in. Link-time optimization has to be on both the compile and the link line to do anything.
[common_t41]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -O2
    -DUSB_SERIAL
    -DDBENCH_CPU_MHZ=600u

; LTO on the library and the bench, never on the Arduino core. main/CMakeLists.txt draws the same
; line for the ESP path - "only these objects carry LTO IR; every IDF component is compiled as it
; always was" - and build_src_flags is where PlatformIO draws it, since build_flags reaches the
; framework as well. The core is not built to be re-optimized at link time: its vector table and its
; interrupt handlers are reached from the linker script rather than from any call, and this
; toolchain is gcc 5.4.1, whose LTO is old enough to drop them. An image that lost them flashes
; without complaint and then never enumerates, which is what the first upload did.
build_src_flags =
    -flto
    -ffat-lto-objects
build_unflags =
    -fno-lto
link_flags =
    -O2
    -flto
