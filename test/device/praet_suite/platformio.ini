;
; The praet correctness suite, run on a part instead of on a host.
;
; The suite needs no port. praet_engine.c defines the four mmgr_praet_hw_ hooks strongly and the
; schedule is a state machine the cases drive, so all 46 cases are self contained C. Anything with
; enough flash and a serial port can run them.
;
; Add a part: one [env:] block. Everything else is shared.
;
; build_dir points under the container. PlatformIO writes .pio beside the project otherwise, and
; harness.py stray reports that as build output outside build/, which it is.

[platformio]
build_dir = ../../../build/device_suites
; libdeps has its own setting and build_dir does not cover it. Without this line PlatformIO writes
; .pio/libdeps beside the project and harness.py stray reports it, correctly, as build output loose
; in the checkout.
libdeps_dir = ../../../build/device_suites/libdeps
src_dir = src

[common]
; Everything under src, which is four small files. Three of them include the real sources where those
; live, so nothing is copied and the part runs the same file the host does.
;
; A build_src_filter reaching outside src with ../ is what PlatformIO refuses, reporting "Source
; directory cannot be under variant directory". Measured, on the first build of this project.
build_src_filter = +<*>

; Reaches every source, the Arduino core included, so nothing here may rename or restrict anything
; the core also uses. Includes and defines the suite needs, and nothing else.
build_flags =
    ; Explicit, because Unity is built as a library and the project's include_dir does not reach a
    ; library's own translation unit. unity.c is what needs unity_config.h.
    -Iinclude
    ; Resolved from this project directory, which is test/device/praet_suite. Three levels reach the
    ; repository root and two reach test.
    -I../../integration/test_praet_correctness
    -I../../../src
    -I../../../include
    -I../../../deps/embedded_types/include
    -DMMGR_ENABLE_DMA=1
    -DMMGR_ENABLE_EXTRAM=0
    -DMMGR_PRAET_CHANNELS=8
    -DMMGR_PRAET_BUF_SIZE=256
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_INCLUDE_FLOAT

; Reaches this project's sources alone. The rename has to stay out of build_flags: the Arduino core
; has its own main, and renaming that one leaves the link with no entry point at all.
build_src_flags =
    -Dmain=praet_suite_main

lib_deps = throwtheswitch/Unity@^2.6.0
monitor_speed = 115200

; Teensy 4.1: i.MX RT1062, Cortex-M7, ARMv7E-M. The platform is already installed.
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_src_filter = ${common.build_src_filter}
build_flags = ${common.build_flags}
build_src_flags = ${common.build_src_flags}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}

; ATSAMD51, Cortex-M4F, ARMv7E-M. Change board to whichever M4 is on the desk: adafruit_metro_m4,
; adafruit_itsybitsy_m4, adafruit_grandcentral_m4 are the common ones.
[env:samd51]
platform = atmelsam
board = adafruit_feather_m4
framework = arduino
build_src_filter = ${common.build_src_filter}
build_flags = ${common.build_flags}
build_src_flags = ${common.build_src_flags}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
