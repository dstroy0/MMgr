name: "MMgr CodeQL config"

# Analyze only this library's own source.
#
# Unity sits under test/vendor and is not our code. Its findings are noise that recurs on
# every run and buries the ones that are ours. The build tree is machine output.
#
# Anchored two ways deliberately. A leading "**/" matches path segments BEFORE the directory, of which
# a repo-root directory has none. So the bare pattern is the single one that actually catches it.
paths-ignore:
  - "test/vendor/**"
  - "**/test/vendor/**"
  - "build/**"
  - "**/build/**"
  - "build-*/**"
