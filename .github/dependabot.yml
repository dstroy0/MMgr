version: 2
updates:
  # The workflows pin actions by tag; without this they silently rot and a pinned SHA never moves.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

  # Node-based dev/CI tools in package.json (prettier). The library itself has no runtime
  # npm dependencies. This exists so the formatter CI uses is a tracked, bumpable version and
  # not whatever the runner happened to have.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"

  # Python tools (black) for format-code and tools/dev_env.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
