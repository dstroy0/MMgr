name: Proofs

# The checks the suite does not run. The fuzz harnesses, the Lean proofs, CBMC and the machine arm on each proof
# harness, and GenMC on each thread client. The harness test/harness.py runs each one, with the flags it retains. A flag that
# this file also writes is a second copy of that flag.
#
# A hosted runner has 16 GB of memory. The prove --hosted command does not run a harness whose bound needs more memory
# or more time than a run has, and the run names each harness that it does not run.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: proofs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-24.04
    env:
      # libFuzzer comes with clang. The fuzz tree uses the compiler that CMake finds from these two names.
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7

      - name: Build and run the fuzz harnesses
        run: python3 test/harness.py fuzz

  lean:
    name: Lean
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: theory/locus_carcerum
    steps:
      - uses: actions/checkout@v7

      # The Lean of embedded_types is at deps/embedded_types, and only the configure of CMake puts it there. The
      # configure reads the one declaration in deps/CMakeLists.txt, and so this file holds no second copy of it.
      - name: Fetch embedded_types
        working-directory: ${{ github.workspace }}
        run: cmake -S . -B build/fetch -DMMGR_BUILD_TESTS=OFF

      - name: Install elan
        # elan installs the toolchain that lean-toolchain names, at the first lake command.
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the proofs
        run: lake build

      - name: No proof is open
        # lake build passes a theorem that sorry closes, and only shows a warning. This step fails on it.
        run: |
          if grep -rn --include='*.lean' -w sorry LocusCarcerum LocusCarcerum.lean; then
            echo "::error title=sorry::a proof is open"
            exit 1
          fi

      - name: Build the proofs of the walks and the sort
        working-directory: theory/linea
        run: lake build

      - name: No proof of the walks or the sort is open
        working-directory: theory/linea
        run: |
          if grep -rn --include='*.lean' -w sorry Linea Linea.lean; then
            echo "::error title=sorry::a proof is open"
            exit 1
          fi

  prove:
    name: CBMC and machine code
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # The harnesses take the headers of embedded_types from deps/embedded_types, as the Lean job does
      - name: Fetch embedded_types
        run: cmake -S . -B build/fetch -DMMGR_BUILD_TESTS=OFF

      - name: Install CBMC
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cbmc

      - name: Install the symbolic executor
        # prove.py runs symbolic.py from this virtual environment. This is the version that the proofs use on a
        # workstation.
        run: |
          python3 -m venv ~/.venvs/angr
          ~/.venvs/angr/bin/pip install -q angr==10.0.5

      - name: Prove
        run: python3 test/harness.py prove --arm cbmc --arm machine --hosted

      - name: Retain the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prove-${{ github.run_id }}
          path: build/prove-*
          if-no-files-found: ignore

  # One GenMC job runs each memory model, so the five models run side by side. A cache retains the GenMC build between
  # runs, with the hash of the prove tool as its key. An edit to the tool makes a new build, and the tag of GenMC is
  # among its contents.
  # A job gets the 360 minutes of a hosted runner: prove.py gives a writers run under rc11 and arm8 330 of them. Under
  # imm the writers client needs more, and prove --hosted names it and does not run it.
  genmc:
    name: GenMC ${{ matrix.model }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        model: [sc, tso, rc11, imm, arm8]
    steps:
      - uses: actions/checkout@v7

      # The clients take the headers of embedded_types from deps/embedded_types, as the Lean job does
      - name: Fetch embedded_types
        run: cmake -S . -B build/fetch -DMMGR_BUILD_TESTS=OFF

      - name: Retain the GenMC build between runs
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/bin/genmc
            ~/.local/include/genmc
            ~/.local/lib/genmc
          key: genmc-${{ runner.os }}-${{ hashFiles('test/prove/prove.py') }}

      - name: Run each thread client under the model
        # The first run on a host installs the packages of GenMC, then builds and installs the tag that prove.py
        # names. A run with the build from the cache installs the packages alone.
        run: python3 test/harness.py prove --arm genmc --model ${{ matrix.model }} --hosted

      - name: Retain the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genmc-${{ matrix.model }}-${{ github.run_id }}
          path: build/prove-*
          if-no-files-found: ignore
