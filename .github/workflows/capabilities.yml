name: Capabilities

# The trees the default build skips. MMGR_ENABLE_DMA and MMGR_ENABLE_EXTRAM both default off, and
# with them off their modules are absent and their suites skipped, so the analysis job never compiles
# them. Each tree here is one test/harness.py carries, with its flags, and the harness is what runs
# it: a flag written out here as well would be a second copy of it.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: capabilities-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tree:
    name: ${{ matrix.tree }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tree: [build-dma, build-dma-lean, build-extram]
    steps:
      - uses: actions/checkout@v7

      - name: Build and test
        run: python3 test/harness.py test --tree ${{ matrix.tree }} --jobs 4
