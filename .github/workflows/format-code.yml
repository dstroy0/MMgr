name: Format

# Three formatters, one per language, each owning its own files and nothing else:
#
#   clang-format  src/ test/   .c .h        style in .clang-format
#   black         tools/       .py          line-length in pyproject.toml
#   prettier      everywhere   md json yml  ignores in .prettierignore
#
# All three wrap at 120 columns, so a tool in tools/dev_env and the C it rewrites line up in a
# side-by-side diff.
#
# This job CHECKS, it does not write. A formatter that rewrites on CI produces commits nobody
# reviewed and races the author's own push; the fix belongs in the working tree. Every step reports
# the exact command that fixes it locally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # continue-on-error on each step so one failure does not hide the other two: three separate
      # red steps tell you everything that needs fixing in one run, where a hard fail on the first
      # would send you round again for the second.
      - name: clang-format (C)
        id: clang
        continue-on-error: true
        run: |
          clang-format --version
          find src test -name '*.c' -o -name '*.h' 2>/dev/null \
            | grep -v '^test/vendor/' \
            | xargs --no-run-if-empty clang-format --dry-run --Werror

      - name: black (Python)
        id: black
        continue-on-error: true
        run: |
          pip install --upgrade black
          black --check --diff tools

      - name: prettier (markup and data)
        id: prettier
        continue-on-error: true
        run: |
          npm ci --no-audit --no-fund
          npx prettier --check "**/*.{md,json,yml,yaml,css,html,js,cjs,mjs}"

      - name: Verdict
        run: |
          fail=0
          for r in "clang-format:${{ steps.clang.outcome }}" \
                   "black:${{ steps.black.outcome }}" \
                   "prettier:${{ steps.prettier.outcome }}"; do
            name="${r%%:*}"; outcome="${r##*:}"
            if [ "$outcome" != "success" ]; then
              echo "::error title=$name::formatting check failed"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            {
              echo "### Formatting"
              echo ""
              echo "Fix locally with:"
              echo '```sh'
              echo "find src test -name '*.c' -o -name '*.h' | grep -v '^test/vendor/' | xargs clang-format -i"
              echo "black tools"
              echo "npm run format"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "all three formatters clean"
