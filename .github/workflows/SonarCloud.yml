name: SonarQube

# Analysis plus coverage.
#
# C is not a language SonarQube can analyze from source alone - it needs to know how each
# translation unit was actually compiled. The build wrapper exists for that: it wraps the real
# build and records every compiler invocation, and the scanner reads that. Without it the C files
# get no scan and the dashboard shows a green project that analyzed nothing.
#
# Coverage comes from gcov. The build has --coverage so every TU emits .gcno at
# compile time and .gcda when a test runs it. Then ctest runs the whole suite to produce the .gcda,
# and then gcovr joins them. Order matters: no .gcda exists until the tests run. A scanner
# invoked before ctest reports 0%.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Shallow clones break blame-based new-code detection, and so Sonar cannot tell which
          # findings are new.
          fetch-depth: 0

      - name: Install gcovr
        run: pip install --upgrade gcovr

      - name: Install build wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@e805d875275f728fac1885b413934be6d7c63f65 # v8

      # --coverage on both compile and link. It implies -fprofile-arcs -ftest-coverage at compile
      # time and -lgcov at link time, and the compile half alone fails at link time.
      #
      # -include test/support/coverage_inline.h drops always_inline off MMGR_INLINE for this build
      # only. The gcc compiler honors always_inline at -O0. So without it a header entry gets a full
      # set of branch records at every call site. The report then counts optimizer copies and not
      # source branches. The header says the rest.
      - name: Configure
        run: >
          cmake -S . -B build --fresh
          -DCMAKE_BUILD_TYPE=Debug
          -DMMGR_BUILD_TESTS=ON
          -DMMGR_LTO=OFF
          -DMMGR_MODULE_OPTIMIZE=OFF
          -DCMAKE_C_FLAGS="--coverage -fprofile-update=atomic -O0 -g -include ${{ github.workspace }}/test/support/coverage_inline.h"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build (wrapped)
        run: build-wrapper-linux-x86-64 --out-dir bw-output cmake --build build --parallel

      # The suite is the thing that produces .gcda. It is also a real gate: a test that fails should
      # fail this job and not quietly report the coverage of a broken build.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # An MMGR_ASSERT that fails stops the program, and so its failure arm is no branch a green suite runs.
      # The condition is still evaluated in the checks environment.
      - name: Coverage report
        run: >
          gcovr --root . --sonarqube coverage.xml
          --exclude 'test/'
          --exclude 'build/'
          --exclude-branches-by-pattern '.*MMGR_ASSERT.*'
          --print-summary

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            --define sonar.cfamily.compile-commands=bw-output/compile_commands.json
            --define sonar.coverageReportPaths=coverage.xml
