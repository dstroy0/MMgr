name=MMgr
version=0.1.0
author=Douglas Quigg (dstroy0) <dquigg123@gmail.com>
maintainer=Douglas Quigg (dstroy0) <dquigg123@gmail.com>
sentence=Zero-heap memory manager in C11 with a fully deterministic footprint.
paragraph=Confinia, pools, spans and rings are carved out of a single borrowed region and reached by asserted offset, so every allocation is decided at compile time and there is no malloc anywhere. Scanning is SWAR-accelerated, with the word width chosen at the ingestion path so the rest of the code is width-agnostic. Every translation unit is host-buildable and host-testable under CMake and CTest; the only headers the library reaches for are stddef, stdint and stdatomic.
category=Data Storage
url=https://github.com/dstroy0/MMgr
