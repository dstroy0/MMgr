sonar.projectKey=dstroy0_MMgr
sonar.organization=dstroy0

sonar.projectName=MMgr
sonar.projectVersion=0.1.0

# Paths are relative to this file.
#
# sources and tests are split so the dashboard does not charge test code against the library's own
# duplication and complexity numbers, and so a rule that only makes sense for shipped code is not
# raised against a fixture.
sonar.sources=src
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Vendored Unity is not this project's code. Left in, every one of its findings lands on this
# dashboard and the ones that are ours get lost in them.
sonar.exclusions=build/**,build-*/**,test/vendor/**
sonar.test.exclusions=test/vendor/**
sonar.coverage.exclusions=test/**,tools/**

# Written by the workflow: build-wrapper records how each TU was really compiled, gcovr writes the
# merged coverage. Both are produced during the run, neither is committed.
sonar.cfamily.compile-commands=bw-output/compile_commands.json
sonar.coverageReportPaths=coverage.xml
