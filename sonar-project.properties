sonar.projectKey=dstroy0_MMgr
sonar.organization=dstroy0

sonar.projectName=MMgr
sonar.projectVersion=1.0.0

# Paths are relative to this file.
#
# sources and tests are two sets so the dashboard does not charge test code against the library's own
# duplication and complexity numbers. The split also keeps a rule that only makes sense for shipped
# code off a fixture.
sonar.sources=src
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Vendored Unity is not this project's code. Left in, every one of its findings lands on this
# dashboard and the ones that are ours get lost in them.
sonar.exclusions=build/**,build-*/**,test/vendor/**
sonar.test.exclusions=test/vendor/**
sonar.coverage.exclusions=test/**,tools/**

# Two rules this project does not take, each for one reason.
#
# c:S1905 reads a cast against the one compile the scanner sees. The cast it calls redundant at 64 bits
# holds a promoted value at embed_word at EMBED_WORD_BITS=16, where -Wconversion needs it.
#
# c:S1117 reads a struct member as a declaration in the file's scope. These members mirror the public
# Cfg members of the same name, which EMBED_CALL designates, and no member hides a file-scope name.
sonar.issue.ignore.multicriteria=castwidth,mirrormember
sonar.issue.ignore.multicriteria.castwidth.ruleKey=c:S1905
sonar.issue.ignore.multicriteria.castwidth.resourceKey=**/*
sonar.issue.ignore.multicriteria.mirrormember.ruleKey=c:S1117
sonar.issue.ignore.multicriteria.mirrormember.resourceKey=src/verbum_scrutor/verbum_scrutor.c

# Written by the workflow: build-wrapper records how each TU was really compiled, gcovr writes the
# merged coverage. Both come out of the run, neither goes into the tree.
sonar.cfamily.compile-commands=bw-output/compile_commands.json
sonar.coverageReportPaths=coverage.xml
