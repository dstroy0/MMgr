#
# What MMgr answers differently from the toolkit defaults, and nothing that agrees with them.
# lib/repotools/defaults.toml carries the rest with a comment on each key saying what it decides.
#
# Every value below was read off this tree rather than assumed. Where the tree and a metadata file
# disagreed, the tree won and the disagreement is noted on the line.

[project]
name = "MMgr"
# CMakeLists.txt project(MMgr VERSION 1.0.0), library.json and library.properties all agree.
version = "1.0.0"
# The expression the source files actually carry. The library.json file records the bare
# "AGPL-3.0-or-later" for the package registries, which is the AGPL arm alone. The file headers state
# all three arms and a generated file has to match the files beside it.
spdx = "AGPL-3.0-or-later OR LicenseRef-Commercial OR LicenseRef-Educational"
# MMgr's own macros and public symbols: MMGR_ENABLE_DMA, MMGR_DEBUG_CHECKS, mmgr_memor_chr.
#
# Not EMBED. The width and decls vocabulary this tree uses, EMBED_WORD_BITS,
# EMBED_BEGIN_DECLS, EMBED_STATIC_ASSERT, embed_word, belongs to the embedded_types dependency
# fetched under deps/, not to MMgr. A tool that took EMBED as this project's prefix would rename a
# dependency's public surface.
prefix = "MMGR"

[layout]
# source, docs, tests, tools and scratch all match the defaults and stay with them.
#
# MMgr ships no examples directory. Stated as empty rather than omitted. The default is
# ["examples"] and Config.existing() refuses a root list whose every entry is absent. A root list
# that falls back to the default would turn any examples walk into a hard exit instead of an empty result.
examples = []

[code]
# extensions are .c and .h, which is the default, so it does not appear again here.
#
# One generated file per suite, emitted by the test framework. It is nobody's source. Three
# separate tools in tools/dev_env already skip it by name, which is the duplication
# this key exists to end.
skip_files = ["unity_runner.c"]
# One entry, not the whole list. [code] exclude is in the loader's EXTENDED_LISTS, so this joins
# the fourteen defaults and does not replace them. MMgr picks up any exclusion the toolkit adds
# later. A load of this file resolves to fifteen names, all fourteen defaults present, no
# duplicate.
#
# html is the Doxygen output tree under docs/. Excluded by NAME, so the walk passes it wherever it
# appears. The prose walk reads the same list, and so docs/html leaves both walks with one entry here.
exclude = ["html"]

[prose]
# extensions is [".md"], the default.
#
# The "build" exclusion above covers the timestamped build-*, bench-* and praet-* trees under
# build/, and so they have no name here. Exclusion is by directory NAME anywhere in a walk, and
# they all sit inside build/.
#
# docs/ carries the generated Doxygen tree at docs/html, which "html" in [code] exclude removes from
# this walk too. The prose walk and the code walk read the same exclusion list.
roots = [
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "dma-plan.md",
    "writing-bans.md",
    "docs",
]

# [hooks] gates is deliberately not set, so it inherits the empty default and no pre-commit gate
# goes in. One turned on points git at a hook driver, and that is a decision about this tree's
# git configuration rather than a knob.
#
# [fetch] sets is deliberately not set, so MMgr fetches nothing from the toolkit yet. A set named
# here is what makes the toolkit upstream of these files.
#
# The maintenance set is not ready for MMgr to fetch. The readclean.py there is a different tool
# with the same name. It shares no API at all with the shape-aware C blinder in tools/dev_env. A
# fetch of it would orphan readclean_test.py, which passes twenty-five assertions against the
# local one. The sizes.py and dedup.py tools are worth a fetch once the toolkit puts them in a set.
